[project]
name = "jobhunt-agent"
version = "0.1.0"
description = "AI agent that helps score CV/job fit and draft cover letters"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "click>=8.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.scripts]
jobhunt = "cli:cli"

[tool.setuptools]
packages = ["src", "src.jobhunt_agent"]
py-modules = ["cli"]

[tool.ruff.lint]
ignore = ["BLE001", "DTZ005"]